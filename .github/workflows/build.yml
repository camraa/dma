name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compilation et paquet
        shell: cmd
        run: make_dist.bat
      - uses: actions/upload-artifact@v4
        with:
          name: Camras-Tool
          path: dist/*.zip
      - name: Publication de la version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Camra's Tool ${GITHUB_REF_NAME#v}" --notes-file NOTES.md
